name: Keep Supabase Active

on:
  schedule:
    # Triggers every 72 hours (at 00:00 UTC every 3 days)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual execution from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase API
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pqrcyfcfzvoqtulssxdi.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "1. Checking Supabase project endpoint..."
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ℹ️ SUPABASE_ANON_KEY secret not set. Testing public health endpoint..."
            AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$CLEAN_URL/auth/v1/health" || echo "000")
            echo "Public health status: $AUTH_CODE"
            echo "✅ Project ping check executed."
            exit 0
          fi

          echo "1. Pinging Supabase Auth Health with key..."
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/auth/v1/health" || echo "000")
          echo "Auth status: $AUTH_CODE"

          echo "2. Querying Supabase PostgREST API..."
          REST_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/" || echo "000")
          echo "REST API status: $REST_CODE"

          echo "✅ Supabase project pinged successfully."
