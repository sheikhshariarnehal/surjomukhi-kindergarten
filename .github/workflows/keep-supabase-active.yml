name: Keep Supabase Active

on:
  schedule:
    # Triggers every 72 hours (at 00:00 UTC every 3 days)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual execution from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase API
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secrets! Please set SUPABASE_URL and SUPABASE_ANON_KEY in GitHub Repository Secrets."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Pinging Supabase project REST API at: $CLEAN_URL/rest/v1/"
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/")

          echo "Supabase REST API Response Status Code: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 400 ]; then
            echo "✅ Supabase project pinged successfully! Project will remain active."
          else
            echo "::error::Failed to ping Supabase REST API. Returned HTTP status: $RESPONSE_CODE"
            exit 1
          fi
