name: Keep Supabase Active

on:
  schedule:
    # Triggers every 72 hours (at 00:00 UTC every 3 days)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual execution from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase API
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secrets! Please set SUPABASE_URL and SUPABASE_ANON_KEY in GitHub Repository Secrets."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"

          echo "1. Pinging Supabase Auth Health..."
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/auth/v1/health")
          echo "Auth status: $AUTH_CODE"

          echo "2. Querying Supabase PostgREST API (triggers database activity)..."
          REST_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/")
          echo "REST API status: $REST_CODE"

          if [ "$AUTH_CODE" -eq 200 ] || [ "$REST_CODE" -eq 200 ] || [ "$REST_CODE" -eq 404 ]; then
            echo "✅ Supabase project pinged successfully! Database activity recorded."
          else
            echo "::error::Failed to ping Supabase. Auth: $AUTH_CODE, REST: $REST_CODE"
            exit 1
          fi
